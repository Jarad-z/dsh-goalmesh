<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">DSH GoalMesh</title>
  <desc id="desc">Goal-driven multi-agent orchestration for DeepSeek Harness, shown as one goal flowing into a coordinated agent mesh.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#93c5fd" opacity=".32"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1d4ed8" flood-opacity=".10"/>
    </filter>
    <filter id="node-shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1d4ed8" flood-opacity=".15"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="438" rx="28" fill="url(#paper)" stroke="#dbeafe" stroke-width="2"/>
  <path d="M1 28A27 27 0 0 1 28 1h1144a27 27 0 0 1 27 27v384a27 27 0 0 1-27 27H28A27 27 0 0 1 1 412Z" fill="url(#dots)" opacity=".75"/>
  <circle cx="1038" cy="70" r="190" fill="#dbeafe" opacity=".34"/>
  <circle cx="1150" cy="355" r="150" fill="#e0f2fe" opacity=".48"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(68 58)">
      <rect width="214" height="34" rx="17" fill="#eff6ff" stroke="#bfdbfe"/>
      <circle cx="18" cy="17" r="5" fill="#2563eb"/>
      <text x="34" y="22" fill="#1d4ed8" font-size="13" font-weight="700" letter-spacing="1.7">DEEPSEEK HARNESS</text>
    </g>

    <text x="66" y="196" fill="#0f2c52" font-size="66" font-weight="760" letter-spacing="-2.4">DSH GoalMesh</text>
    <text x="69" y="247" fill="#365b82" font-size="24" font-weight="520">One goal. A coordinated agent mesh.</text>
    <text x="69" y="286" fill="#6483a3" font-size="17">Bounded DAGs · Nested delegation · Typed evidence · Durable trajectories</text>

    <g transform="translate(68 330)" font-size="12" font-weight="700" letter-spacing="1.1">
      <rect width="132" height="34" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="66" y="22" text-anchor="middle" fill="#1d4ed8">GOAL-DRIVEN</text>
      <rect x="144" width="130" height="34" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="209" y="22" text-anchor="middle" fill="#1d4ed8">MULTI-AGENT</text>
      <rect x="286" width="118" height="34" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="345" y="22" text-anchor="middle" fill="#1d4ed8">OBSERVABLE</text>
    </g>
  </g>

  <g transform="translate(742 44)" filter="url(#shadow)">
    <rect width="394" height="350" rx="30" fill="#ffffff" stroke="#cfe3fb" stroke-width="1.5"/>
    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
      <text x="30" y="38" fill="#7894af" font-size="11" font-weight="750" letter-spacing="1.5">GOAL → ORCHESTRATE → EVIDENCE</text>
      <line x1="30" y1="52" x2="364" y2="52" stroke="#e5effa"/>

      <g transform="translate(147 70)">
        <rect width="100" height="38" rx="19" fill="#eff6ff" stroke="#93c5fd"/>
        <circle cx="20" cy="19" r="6" fill="#2563eb"/>
        <text x="59" y="24" text-anchor="middle" fill="#174ea6" font-size="13" font-weight="750">GOAL</text>
      </g>

      <path d="M197 108v35M197 197v32M197 197 78 246M197 197l119 49M197 279v20" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
      <path d="M78 246v53M316 246v53" fill="none" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round"/>

      <g transform="translate(148 143)" filter="url(#node-shadow)">
        <rect width="98" height="54" rx="17" fill="url(#blue)"/>
        <circle cx="22" cy="20" r="6" fill="#ffffff" opacity=".95"/>
        <circle cx="22" cy="35" r="4" fill="#dbeafe"/>
        <text x="60" y="32" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="750">MESH</text>
      </g>

      <g filter="url(#node-shadow)">
        <circle cx="78" cy="246" r="27" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
        <circle cx="197" cy="246" r="27" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
        <circle cx="316" cy="246" r="27" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
        <text x="78" y="251" text-anchor="middle" fill="#2563eb" font-size="12" font-weight="800">A1</text>
        <text x="197" y="251" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="800">A2</text>
        <text x="316" y="251" text-anchor="middle" fill="#0284c7" font-size="12" font-weight="800">A3</text>
      </g>

      <text x="78" y="287" text-anchor="middle" fill="#7894af" font-size="10" font-weight="650">RESEARCH</text>
      <text x="197" y="287" text-anchor="middle" fill="#7894af" font-size="10" font-weight="650">BUILD</text>
      <text x="316" y="287" text-anchor="middle" fill="#7894af" font-size="10" font-weight="650">VERIFY</text>

      <g transform="translate(42 299)">
        <rect width="310" height="30" rx="15" fill="#f5faff" stroke="#dbeafe"/>
        <circle cx="22" cy="15" r="5" fill="#22c55e"/>
        <text x="39" y="20" fill="#42698f" font-size="11" font-weight="650">typed reports · durable trajectory · bounded cleanup</text>
      </g>
    </g>
  </g>
</svg>
